<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой сайт</title>
    <link rel="stylesheet" href="../../../../style.css" />
    <link rel="stylesheet" href="technical-support.css" />
  </head>
  <body>
    <div id="technical-support__form" class="modal">
      <form class="modal__form" id="technical-support">
        <div class="modal__header">
          <h4 class="modal__title">Обращение в техническую поддержку</h4>
          <svg
            class="modal__close-icon svg-icon"
            id="close-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <path
              d="M17.4697 5.46967C17.7626 5.17678 18.2373 5.17678 18.5302 5.46967C18.8231 5.76256 18.8231 6.23732 18.5302 6.53022L6.53022 18.5302C6.23732 18.8231 5.76256 18.8231 5.46967 18.5302C5.17678 18.2373 5.17678 17.7626 5.46967 17.4697L17.4697 5.46967Z"
              fill="#B4B4B4"
            />
            <path
              d="M5.46967 5.46967C5.76256 5.17678 6.23732 5.17678 6.53022 5.46967L18.5302 17.4697L18.582 17.5263C18.8223 17.8209 18.8048 18.2556 18.5302 18.5302C18.2556 18.8048 17.8209 18.8223 17.5263 18.582L17.4697 18.5302L5.46967 6.53022C5.17678 6.23732 5.17678 5.76256 5.46967 5.46967Z"
              fill="#B4B4B4"
            />
          </svg>
        </div>
        <div class="modal__main">
          <label
            style="width: 552px"
            class="technical-support__label"
            for="name"
            >ФИО*
            <input
              class="input input--small"
              type="text"
              id="name"
              name="user_name"
            />
          </label>

          <label class="technical-support__label" for="feedback-format"
            >Формат обратной связи*
            <select
              class="select select--small"
              name="feedback-format"
              id="feedback-format"
              required
            >
              <option value="">Выберите формат связи</option>
              <option value="phone">Мобильный телефон</option>
              <option value="email">Электронная почта</option>
            </select></label
          >

          <!-- Динамический инпут для контактной информации -->
          <div id="contact-input-container" style="display: none">
            <label class="technical-support__label" for="contact-info">
              <span id="contact-label">Контактная информация*</span>
              <input
                class="input input--small"
                type="text"
                id="contact-info"
                name="contact_info"
                placeholder=""
              />
            </label>
          </div>

          <label for="message">
            Сообщение о проблеме
            <textarea
              rows="8"
              class="textarea textarea--small"
              name="message"
              id="message"
              required
            ></textarea>
          </label>
        </div>
        <div class="modal__footer">
          <div class="modal__actions">
            <button class="btn btn--small btn--secondary">Отмена</button>
            <button class="btn btn--small btn--primary">Отправить</button>
          </div>
        </div>
      </form>
    </div>
    <script src="technical-support.js"></script>
  </body>
</html>
