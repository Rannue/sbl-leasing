<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой сайт</title>
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body>
    <div class="autarization__container">
      <div class="autarization__wrapper">
        <div class="autarization__technical-support">
          <p>Техническая поддержка</p>
        </div>
        <div class="autarization__autarization-info">
          <div class="autarization__title">
            <img
              class="autarization__logo"
              src="../../assets/icons/_105553126334080.svg"
              alt=""
            />
            <h1 class="autarization__title-text">Авторизация</h1>
          </div>
          <div class="autarization__fields">
            <label>
              Введите номер телефона
              <input
                placeholder="+375 00 000 00 00"
                class="input input--small"
                type="text"
              />
            </label>
            <a href="../../index.html">
              <button class="autarization-btn btn btn--primary btn--medium">
                Получить код
              </button>
            </a>
            <div class="autarization__separator">
              <hr />
              или
              <hr />
            </div>
            <button class="btn btn--secondary btn--medium">
              Войти по номеру телефона
            </button>
            <button class="btn btn--secondary btn--medium">
              <img
                class="autarization__msi-logo"
                src="../../assets/icons/Clip path group.svg"
                alt=""
              />
              Войти через МСИ
            </button>
          </div>
        </div>
        <div class="autarization__registration">
          <p class="autarization__registration-info">
            <b style="font-weight: 600; color: var(--color-black)"
              >У вас нет аккаунта?</b
            >
            Регистрация в системе осуществляется через МСИ (Межведомственную
            Cистему Идентификации). Для ознакомления с системой перейдите
            <a class="autarization__link" href="https://example.com"
              >по ссылке</a
            >.
          </p>
          <div class="autarization__registration-link">
            <a class="autarization__link" href="https://example.com"
              >Зарегистрироваться через МСИ</a
            >
          </div>
        </div>
      </div>
      <img
        class="autarization__img"
        src="../../assets/img/background.png"
        alt=""
      />
    </div>
  </body>
</html>
