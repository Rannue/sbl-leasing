<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена - СБЛ Лизинг</title>
    <meta
      name="description"
      content="Ошибка 404 - запрашиваемая страница не найдена на сайте СБЛ Лизинг"
    />
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body>
    <main>
      <div class="main__container">
        <div class="not-found__container">
          <div class="not-found__wrapper">
            <img
              class="not-found__img"
              src="../../assets/img/Error Alien Spaceship.svg"
              alt="Ошибка 404 - НЛО"
            />
            <div class="not-found__content">
              <h1>Страница не найдена</h1>
              <p class="not-found__p-text">
                Похоже, такой страницы больше нет или она никогда не
                существовала. Вы можете перейти на главную страницу.
              </p>
            </div>
            <a href="../../index.html" class="btn btn--primary btn--medium">
              Перейти на главную страницу
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
